<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lumen Rail</title>
<style>
  :root { --ink: #f2ecdf; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: Georgia, 'Times New Roman', serif; color: var(--ink);
    -webkit-user-select: none; user-select: none; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* soft cab vignette */
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(130% 105% at 50% 42%, transparent 58%, rgba(0,0,0,0.55) 88%, rgba(0,0,0,0.9) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 11%),
      linear-gradient(to top, rgba(0,0,0,0.55), transparent 14%); }

  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.1rem; text-align: center;
    background: radial-gradient(90% 90% at 50% 45%, #0d0a18 0%, #000 100%);
    transition: opacity 1.8s ease; cursor: pointer; z-index: 10; padding: 0 16px; }
  #overlay.gone { opacity: 0; pointer-events: none; }
  #overlay h1 { font-weight: normal; letter-spacing: 0.45em; text-indent: 0.45em;
    font-size: clamp(1.6rem, 5vw, 3rem); margin: 0; color: #efe6ff;
    text-shadow: 0 0 24px rgba(170,140,255,0.8), 0 0 60px rgba(170,140,255,0.4); }
  #overlay p { margin: 0; opacity: 0.65; font-style: italic; font-size: 0.95rem; line-height: 1.7; }
  #overlay .hint { font-size: 0.8rem; opacity: 0.45; font-style: normal;
    letter-spacing: 0.12em; }

  #segname { position: fixed; top: 7%; left: 0; right: 0; text-align: center;
    pointer-events: none; font-style: italic; letter-spacing: 0.3em; text-indent: 0.3em;
    font-size: clamp(1rem, 2.6vw, 1.5rem); opacity: 0;
    text-shadow: 0 0 18px rgba(255,240,210,0.7); }
  #segname.show { animation: toast 5s ease forwards; }
  @keyframes toast { 0% {opacity:0; transform:translateY(6px);} 12% {opacity:0.9; transform:none;}
    75% {opacity:0.9;} 100% {opacity:0;} }

  #hud { position: fixed; bottom: 18px; left: 0; right: 0; display: flex;
    align-items: center; justify-content: center; gap: 14px; z-index: 5; }
  #hud button { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22);
    color: var(--ink); width: 38px; height: 38px; border-radius: 50%; font-size: 1.05rem;
    cursor: pointer; backdrop-filter: blur(4px); }
  #hud button:hover { background: rgba(255,255,255,0.16); }
  #hud button.off { opacity: 0.4; }
  #speedbar { width: min(180px, 34vw); height: 3px; background: rgba(255,255,255,0.15);
    border-radius: 2px; overflow: hidden; }
  #speedfill { height: 100%; width: 30%; background: linear-gradient(90deg, #ffd9a0, #c9b0ff);
    border-radius: 2px; transition: width 0.3s ease; }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="segname"></div>
<div id="hud">
  <button id="slower" title="slower">−</button>
  <div id="speedbar"><div id="speedfill"></div></div>
  <button id="faster" title="faster">+</button>
  <button id="pause" title="pause (double-tap space)">❙❙</button>
  <button id="mute" title="sound">♪</button>
</div>
<div id="overlay">
  <h1>LUMEN RAIL</h1>
  <p>a suspended ride through tunnels of light</p>
  <p class="hint">tap to board · arrow keys or drag to look around · scroll or − + for speed · double-tap space to pause · M to mute</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.js",
    "three/addons/": "./js/vendor/addons/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
